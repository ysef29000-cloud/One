<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#FC82A7;--pale:#FDE3EB;--ink:#0B0B0B;--grey:#5a5a5a}
@page{size:96mm 56mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff}
/* 90x50mm trim + 3mm bleed each side */
.card{width:96mm;height:56mm;position:relative;overflow:hidden;background:#fff;break-after:page}
.trim{position:absolute;left:3mm;top:3mm;width:90mm;height:50mm}
.safe{position:absolute;left:7mm;top:7mm;width:82mm;height:42mm}
.guides .trim{outline:0.2mm dashed rgba(0,160,255,.8)}
.guides .safe{outline:0.2mm dashed rgba(255,0,0,.5)}

/* FRONT */
.front .logo{position:absolute;left:50%;top:46%;width:52mm;transform:translate(-50%,-50%);mix-blend-mode:multiply}
.front .band{position:absolute;left:0;right:0;bottom:0;height:8.5mm;background:var(--pink)}
.front .band span{position:absolute;left:0;right:0;top:2.1mm;text-align:center;font:700 6.4pt 'Cormorant Garamond';letter-spacing:.42em;color:var(--ink)}

/* BACK */
.back .stripe{position:absolute;left:0;top:0;bottom:0;width:9mm;background:var(--pink)}
.back .wm{position:absolute;right:1mm;top:50%;transform:translateY(-52%);font:400 50mm/1 'Playfair Display';color:var(--pale);letter-spacing:-.04em}
.back .content{position:absolute;left:14.5mm;top:9.5mm;right:7mm}
.name{font:500 12.6pt/1 'Playfair Display';letter-spacing:.08em;color:var(--ink);white-space:nowrap}
.pill{display:inline-block;margin-top:2.6mm;background:var(--pink);border-radius:1.3mm;padding:1.1mm 2.6mm 1mm;font:700 6.3pt/1 'Cormorant Garamond';letter-spacing:.15em;color:var(--ink)}
.role{margin-top:2.2mm;font:600 7.2pt/1.3 'Cormorant Garamond';letter-spacing:.14em;color:var(--grey)}
.role b{color:var(--ink);font-weight:700}
.rule{margin:3mm 0 2.8mm;width:28mm;height:.3mm;background:var(--ink)}
.contact{display:flex;flex-direction:column;gap:1.7mm}
.row{display:flex;align-items:center;gap:2.2mm;font:600 7.4pt/1 'Montserrat';letter-spacing:.06em;color:var(--ink)}
.row small{font:600 5.2pt 'Montserrat';letter-spacing:.18em;color:var(--grey);width:14.5mm}
.ic{width:4.4mm;height:4.4mm;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.ic svg{width:2.5mm;height:2.5mm;fill:var(--pink)}
</style></head><body>

<section class="card front"><div class="trim"></div><div class="safe"></div>
  <img class="logo" src="assets/one-rose-logo-cropped.png" alt="One Rose Beauty Clinic">
  <div class="band"><span>SKIN · HAIR · LASER</span></div>
</section>

<section class="card back"><div class="trim"></div><div class="safe"></div>
  <div class="stripe"></div>
  <div class="wm">OR</div>
  <div class="content">
    <div class="name">MENNA KHALED HAZEM</div>
    <div class="pill">CERTIFIED SKIN &amp; HAIR CARE SPECIALIST</div>
    <div class="role">BEAUTY &amp; LASER CLINIC OWNER<br><b>ONE ROSE</b> BEAUTY CLINIC</div>
    <div class="rule"></div>
    <div class="contact">
      <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></span><small>MOBILE</small>0109 098 9095</div>
      <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg></span><small>WHATSAPP</small>0102 931 7959</div>
    </div>
  </div>
</section>
</body></html>
